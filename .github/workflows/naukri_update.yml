name: Naukri Profile Refresh (Action Version)

on:
  schedule:
    - cron: '30 3 * * *' # Roz subah 9 AM IST
  workflow_dispatch:

jobs:
  refresh_profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Naukri Resume
        uses: sst-vatsal/naukri-resume-action@v1.0.1
        with:
          # Ye secrets tumhare repo mein hone chahiye
          username: ${{ secrets.NAUKRI_EMAIL }}
          password: ${{ secrets.NAUKRI_PASS }}
          # Agar tumhare file ka naam 'Resume.pdf' hai to ye line sahi hai
          resume_path: 'Resume.pdf'
