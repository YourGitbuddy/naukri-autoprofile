name: Naukri Profile Refresh (API Sniper)

on:
  schedule:
    - cron: '45 3 * * *' # Roz subah 9:15 AM IST (approx)
  workflow_dispatch:     # Manual run karne ke liye

jobs:
  refresh_api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requests
        run: pip install requests

      - name: Run API Sniper
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASS: ${{ secrets.NAUKRI_PASS }}
        run: python api_update.py
