name: Naukri Auto Refresh

on:
  schedule:
    - cron: '45 3 * * *'  # Runs daily at 03:45 UTC
  workflow_dispatch:     # Allows manual trigger

jobs:
  refresh-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium==4.21.0 webdriver-manager

      - name: Verify Chrome and Chromedriver
        run: |
          google-chrome --version || true
          which google-chrome || true
          chromedriver --version || true

      - name: Run Naukri Script
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASS: ${{ secrets.NAUKRI_PASS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }} # optional; default imap.gmail.com used in script if not provided
        run: |
          python api_update.py

      - name: Upload Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-pages
          path: |
            after_login.png
            after_login.html
            login_fill_error.png
            login_fill_error.html
            otp_not_found.png
            otp_error.png
            login_failed.png
            login_failed.html
            profile_page.png
            page_source.html
            success.png
            debug_error.png
