name: Naukri Profile Refresh

on:
  schedule:
    - cron: '45 3 * * *' # Roz subah refresh karega (approx 9:15 AM IST)
  workflow_dispatch:      # Manual run karne ke liye option

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install selenium webdriver-manager
          # Chrome aur Driver setup runner par automatic ho jayega

      - name: Run Blind Refresh Script
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASS: ${{ secrets.NAUKRI_PASS }}
        run: python api_update.py

      - name: Upload Debug Screenshot on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug_error.png
