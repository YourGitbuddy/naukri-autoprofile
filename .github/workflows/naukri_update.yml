name: Naukri Profile Refresh

on:
  schedule:
    - cron: '45 3 * * *' # Roz subah 9:15 AM IST par chalega
  workflow_dispatch:      # Manual run karne ka button

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Python setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Saari required libraries ek saath
      - name: Install Dependencies
        run: |
          pip install selenium webdriver-manager requests

      # Script execution
      - name: Run Refresh Script
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASS: ${{ secrets.NAUKRI_PASS }}
        run: python api_update.py

      # Agar fail hua toh screenshot save karega
      - name: Upload Debug Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug_error.png
