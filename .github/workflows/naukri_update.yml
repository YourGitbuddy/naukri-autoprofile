name: Naukri Profile Refresh

on:
  schedule:
    # Roz subah 9:15 AM IST par chalega
    - cron: '45 3 * * *'
  workflow_dispatch: # Manual run ke liye

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install cloudscraper

      - name: Run Invisible Refresh
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASS: ${{ secrets.NAUKRI_PASS }}
        run: python api_update.py
